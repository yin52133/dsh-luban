# Add the host plugin once. The Web approval page is discovered through dsh.client.
- insert:
    - id: luban-plan
      name: dsh-luban-plan
      config:
        plansDir: docs/plans
        stateFile: ~/.dsh/luban/plan/plans.json
        requireApprovalFor: [edit, bash, write]
        autoApproveFor: []
        template: bundled-default

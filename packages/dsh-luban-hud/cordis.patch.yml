# Add the authenticated telemetry host. The Web status bar is discovered from dsh.client.
- insert:
    - id: luban-hud
      name: dsh-luban-hud
      config:
        refreshSec: 1
        thresholds: { warn: 0.70, danger: 0.85, critical: 0.95 }
        display:
          fields: [context, workspace, model, thinking, tpm, rpm]
          compact: false
        history: { enabled: true, retainMinutes: 60 }

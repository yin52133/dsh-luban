name: Bug report
description: Report a reproducible dsh-luban problem without sensitive data
title: 'bug: '
labels: ['bug']
body:
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.2-rc.1
    validations:
      required: true
  - type: textarea
    id: profile-bundles
    attributes:
      label: Profile bundles
      description: List package names and versions only; remove paths, host names, addresses, and credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Do not paste session logs, tokens, passwords, internal host names, or private network details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

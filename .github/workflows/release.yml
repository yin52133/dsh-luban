name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate and create immutable tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag commit to come from mainline
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/mainline:refs/remotes/origin/mainline
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/mainline
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: tools/browser-bridge/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: uv lock --check --project tools/browser-bridge
      - run: uv run --project tools/browser-bridge --locked ruff check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked ruff format --check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked python -m unittest discover -s tools/browser-bridge/tests -v
      - run: uv run --project tools/browser-bridge --locked python -m compileall -q tools/browser-bridge/src tools/browser-bridge/tests
      - run: node scripts/validate-design.mjs
      - run: pnpm validate:features
      - run: pnpm check:architecture
      - run: node scripts/release/validate-release.mjs
      - run: node scripts/release/audit-packages.mjs --dry-run
      - run: node scripts/install-3rd-party.mjs --platform windows --profile win-debug --dry-run
      - run: node scripts/install-3rd-party.mjs --platform ubuntu --profile ubuntu-server --dry-run
      - name: Verify tag and build release payloads
        run: node scripts/release/pack-artifacts.mjs --prepare --tag "${GITHUB_REF_NAME}" --output .release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Protected npm and GitHub publish
    needs: validate-and-pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-${{ github.repository_id }}-${{ github.ref_name }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts
      - name: Recover the create-once publish journal or choose a new release
        id: recovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/release/recover-release.mjs
          --artifacts .release-artifacts
          --repository "${GITHUB_REPOSITORY}"
          --repository-id "${GITHUB_REPOSITORY_ID}"
          --repository-owner-id "${GITHUB_REPOSITORY_OWNER_ID}"
          --expected-sha "${GITHUB_SHA}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Create a recoverable draft release with the exact npm tarballs
        if: steps.recovery.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .release-artifacts/*.tgz
          .release-artifacts/release-manifest.json
          --verify-tag
          --draft
          --title "${GITHUB_REF_NAME}"
          --notes-file .release-artifacts/RELEASE_NOTES.md
      - name: Publish the reviewed tarballs to npm
        if: steps.recovery.outputs.mode != 'verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LUBAN_RELEASE_APPROVED: 'true'
          PUBLISH_ACTION: ${{ steps.recovery.outputs.mode == 'resume' && '--resume' || '--publish' }}
        run: >-
          node scripts/release/publish.mjs "${PUBLISH_ACTION}"
          --artifacts .release-artifacts
          --repository "${GITHUB_REPOSITORY}"
          --expected-sha "${GITHUB_SHA}"
      - name: Publish GitHub Release after npm succeeds
        if: steps.recovery.outputs.mode != 'verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      - name: Verify tag, public Release assets, and npm tarballs are identical
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/release/verify-published-release.mjs
          --artifacts .release-artifacts
          --repository "${GITHUB_REPOSITORY}"
          --repository-id "${GITHUB_REPOSITORY_ID}"
          --repository-owner-id "${GITHUB_REPOSITORY_OWNER_ID}"
          --expected-sha "${GITHUB_SHA}"
      - name: Preserve the append-only npm publish ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publish-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-artifacts/publish-ledger.json
            .release-artifacts/publish-ledger-head.json
            .release-artifacts/publish-ledger.json.events/
            .release-artifacts/publish-ledger.json.commits/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

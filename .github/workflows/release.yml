name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate and create immutable tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/validate-design.mjs
      - run: node scripts/release/validate-release.mjs
      - run: node scripts/release/audit-packages.mjs --dry-run
      - name: Verify tag and build release payloads
        run: node scripts/release/pack-artifacts.mjs --prepare --tag "${GITHUB_REF_NAME}" --output .release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Protected npm and GitHub publish
    needs: validate-and-pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts
      - name: Create a recoverable draft release with the exact npm tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .release-artifacts/*.tgz
          .release-artifacts/release-manifest.json
          --verify-tag
          --draft
          --title "${GITHUB_REF_NAME}"
          --notes-file .release-artifacts/RELEASE_NOTES.md
      - name: Publish the reviewed tarballs to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LUBAN_RELEASE_APPROVED: 'true'
        run: node scripts/release/publish.mjs --publish --artifacts .release-artifacts
      - name: Publish GitHub Release after npm succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate and create immutable tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag commit to come from mainline
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/mainline:refs/remotes/origin/mainline
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/mainline
      - name: Scan the complete tag history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: tools/browser-bridge/uv.lock
      - name: Prove the tag gate rejects a synthetic leak
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --verbose
          node scripts/release/verify-secret-gate.mjs --verify --binary "$RUNNER_TEMP/gitleaks"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: uv lock --check --project tools/browser-bridge
      - run: uv run --project tools/browser-bridge --locked ruff check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked ruff format --check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked python -m unittest discover -s tools/browser-bridge/tests -v
      - run: uv run --project tools/browser-bridge --locked python -m compileall -q tools/browser-bridge/src tools/browser-bridge/tests
      - run: node scripts/validate-design.mjs
      - run: node scripts/release/validate-release.mjs
      - run: node scripts/release/audit-packages.mjs --dry-run
      - run: node scripts/install-3rd-party.mjs --platform windows --profile win-debug --dry-run
      - run: node scripts/install-3rd-party.mjs --platform ubuntu --profile ubuntu-server --dry-run
      - name: Verify tag and build release payloads
        run: node scripts/release/pack-artifacts.mjs --prepare --tag "${GITHUB_REF_NAME}" --output .release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Protected npm and GitHub publish
    needs: validate-and-pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: .release-artifacts
      - name: Create a recoverable draft release with the exact npm tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .release-artifacts/*.tgz
          .release-artifacts/release-manifest.json
          --verify-tag
          --draft
          --title "${GITHUB_REF_NAME}"
          --notes-file .release-artifacts/RELEASE_NOTES.md
      - name: Publish the reviewed tarballs to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LUBAN_RELEASE_APPROVED: 'true'
        run: node scripts/release/publish.mjs --publish --artifacts .release-artifacts
      - name: Publish GitHub Release after npm succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

name: CI

on:
  push:
    branches: [mainline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: tools/browser-bridge/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: uv lock --check --project tools/browser-bridge
      - run: uv run --project tools/browser-bridge --locked ruff check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked ruff format --check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked python -m unittest discover -s tools/browser-bridge/tests -v
      - run: uv run --project tools/browser-bridge --locked python -m compileall -q tools/browser-bridge/src tools/browser-bridge/tests
      - run: node scripts/validate-design.mjs
      - run: pnpm validate:features
      - run: pnpm check:architecture
      - run: node scripts/release/validate-release.mjs
      - run: node scripts/release/audit-packages.mjs --dry-run
      - run: node scripts/install-3rd-party.mjs --platform windows --profile win-debug --dry-run
        if: runner.os == 'Windows'
      - run: node scripts/install-3rd-party.mjs --platform ubuntu --profile ubuntu-server --dry-run
        if: runner.os == 'Linux'
      - name: Run target-host DSH profile smoke
        run: >-
          node scripts/acceptance/m12-profile-smoke.mjs --live
          --expected-git-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --workflow-run-attempt ${{ github.run_attempt }}
          --output .luban/acceptance/m12-${{ runner.os }}.json
      - name: Upload target-host DSH profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m12-profile-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .luban/acceptance/m12-${{ runner.os }}.json
          if-no-files-found: error

  m12-profile-aggregate:
    name: M12 dual-host evidence
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Download Windows profile evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m12-profile-smoke-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .luban/acceptance/windows
      - name: Download Ubuntu profile evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m12-profile-smoke-Linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: .luban/acceptance/ubuntu
      - name: Aggregate same-source dual-host profile evidence
        run: >-
          node scripts/acceptance/m12-profile-smoke.mjs aggregate
          --windows .luban/acceptance/windows/m12-Windows.json
          --ubuntu .luban/acceptance/ubuntu/m12-Linux.json
          --expected-git-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --workflow-run-attempt ${{ github.run_attempt }}
          --output .luban/acceptance/dual/m12-profile-smoke-dual.json
      - name: Upload dual-host profile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m12-profile-smoke-dual-${{ github.run_id }}-${{ github.run_attempt }}
          path: .luban/acceptance/dual/m12-profile-smoke-dual.json
          if-no-files-found: error

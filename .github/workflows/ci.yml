name: CI

on:
  push:
    branches: [mainline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Canonicalize Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonicalTemp = node -e "process.stdout.write(require('node:fs').realpathSync.native(process.env.RUNNER_TEMP))"
          if (-not $canonicalTemp) {
            throw 'Unable to resolve the Windows runner temporary directory.'
          }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: tools/browser-bridge/uv.lock
      - run: pnpm install --frozen-lockfile
      - name: Prepare browser bridge environment
        run: uv sync --locked --no-dev --python 3.12 --project tools/browser-bridge
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Verify recovery terminal input
        if: runner.os == 'Linux'
        run: |
          python3 packages/dsh-luban-auth/tests/recovery-terminal.py
          python3 packages/dsh-luban-auth/tests/recovery-systemd.py
      - run: uv lock --check --project tools/browser-bridge
      - run: uv run --project tools/browser-bridge --locked ruff check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked ruff format --check tools/browser-bridge/src tools/browser-bridge/tests
      - run: uv run --project tools/browser-bridge --locked python -m unittest discover -s tools/browser-bridge/tests -v
      - run: uv run --project tools/browser-bridge --locked python -m compileall -q tools/browser-bridge/src tools/browser-bridge/tests
      - run: node scripts/validate-design.mjs
      - run: pnpm validate:features
      - run: pnpm check:architecture
      - run: node scripts/release/validate-release.mjs
      - run: node scripts/release/audit-packages.mjs --dry-run
      - run: node scripts/install-3rd-party.mjs --platform windows --profile win-debug --dry-run
        if: runner.os == 'Windows'
      - run: node scripts/install-3rd-party.mjs --platform ubuntu --profile ubuntu-server --dry-run
        if: runner.os == 'Linux'

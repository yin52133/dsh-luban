minimum_pre_commit_version: '3.7.0'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml', '--redact']

  - repo: local
    hooks:
      - id: release-metadata
        name: Validate fixed versions, manifests, READMEs, and CHANGELOG
        entry: node scripts/release/validate-release.mjs
        language: system
        pass_filenames: false
        files: '^(package\.json|CHANGELOG\.md|README\.md|packages/[^/]+/(?:package\.json|README\.md)|scripts/release/policy\.json)$'

[project]
name = "luban-browser-bridge"
version = "0.1.0"
description = "Isolated JSONL bridge between dsh-luban and browser-use"
requires-python = "==3.12.*"
dependencies = [
  "browser-use[core]==0.13.8",
]

[dependency-groups]
dev = [
  "ruff==0.16.4",
]

[project.scripts]
luban-browser-bridge = "luban_browser_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luban_browser_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
